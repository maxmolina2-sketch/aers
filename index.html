<!doctype html>
<html lang="es">
<head>

<title>AERS en terreno</title>

<style>
/* layout: una columna de libreta de terreno, botones grandes para usar con una mano y a pleno sol; el panal hexagonal marca el semáforo */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e0e7e4; --ink:#14221f; --ink-2:#44554f; --ink-3:#66766f; --line:#c6d1cc;
  --accent:#17504a; --accent-ink:#ffffff; --accent-soft:#d5e6e1;
  --v:#1c7c43; --v-soft:#d9f0e1; --v-ink:#0c4f28; --a:#d99a00; --a-soft:#fbeec4; --a-ink:#674900; --r:#c5301f; --r-soft:#f9dfdb; --r-ink:#83190e; --on-a:#201700;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rad:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1614; --surface:#16211e; --sunk:#1e2c28; --ink:#e6efeb; --ink-2:#aebdb7; --ink-3:#84958e; --line:#2e3f3a;
  --accent:#6fc7b6; --accent-ink:#06211c; --accent-soft:#1d3a34;
  --v:#3fb06c; --v-soft:#143222; --v-ink:#a5e6bf; --a:#e6b02c; --a-soft:#3a2e0b; --a-ink:#f6d98a; --r:#e5604f; --r-soft:#3e1a15; --r-ink:#f8b8ae; --on-a:#201700;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1614; --surface:#16211e; --sunk:#1e2c28; --ink:#e6efeb; --ink-2:#aebdb7; --ink-3:#84958e; --line:#2e3f3a;
  --accent:#6fc7b6; --accent-ink:#06211c; --accent-soft:#1d3a34;
  --v:#3fb06c; --v-soft:#143222; --v-ink:#a5e6bf; --a:#e6b02c; --a-soft:#3a2e0b; --a-ink:#f6d98a; --r:#e5604f; --r-soft:#3e1a15; --r-ink:#f8b8ae; --on-a:#201700;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
.top-in{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:1.1rem;flex:1;min-width:0;overflow-wrap:anywhere}
.top small{display:block;font:400 .78rem var(--f-body);opacity:.85}
.back{background:none;border:0;color:inherit;font-size:1.5rem;line-height:1;min-width:44px;min-height:44px;margin-left:-10px;cursor:pointer;border-radius:8px;text-decoration:none;display:grid;place-items:center}
main{max-width:720px;margin:auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--ink-2)}.small{font-size:.86rem}
.eyebrow{font:500 .72rem var(--f-data);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--r-ink);border-color:var(--r)}
.btn.armed{background:var(--r);color:#fff;border-color:var(--r)}
.btn.block{width:100%}
.btn.quiet{border-color:transparent;background:none;color:var(--accent);min-height:40px;padding:6px 8px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;cursor:pointer;text-decoration:none;color:inherit}
.card b{font-family:var(--f-display);font-size:1.02rem}
.tag{display:inline-block;font:500 .7rem var(--f-data);padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.tag.ex{background:var(--a-soft);color:var(--a-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:5px 10px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.chip.ok{background:var(--v-soft);color:var(--v-ink)}
.chip.warn{background:var(--a-soft);color:var(--a-ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
label.f span.h{font-weight:400;color:var(--ink-3);font-size:.8rem}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tabs button{min-height:44px;border:0;background:none;border-radius:7px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink)}
/* hexágono del semáforo: color y letra, nunca solo color */
.hex{flex:none;width:38px;height:42px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--sunk);color:var(--ink-3);font:700 .95rem var(--f-display)}
.hex.sm{width:25px;height:28px;font-size:.72rem}
.hex.v{background:var(--v);color:#fff}.hex.a{background:var(--a);color:var(--on-a)}.hex.r{background:var(--r);color:#fff}
.dimhead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding-top:6px}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:12px;display:flex;flex-direction:column;gap:8px}
.sub.done{border-color:var(--ink-3)}
.sub h3{font-size:1rem}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:9px 10px;border-radius:9px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:.92rem;line-height:1.3}
.opt .hex{width:25px;height:28px;font-size:.72rem}
.opt[aria-pressed=true].v{background:var(--v-soft);border-color:var(--v);color:var(--v-ink);font-weight:700}
.opt[aria-pressed=true].a{background:var(--a-soft);border-color:var(--a);color:var(--a-ink);font-weight:700}
.opt[aria-pressed=true].r{background:var(--r-soft);border-color:var(--r);color:var(--r-ink);font-weight:700}
.opt[aria-pressed=true].na{border-color:var(--ink-3);font-weight:700}
.minor{display:flex;gap:8px;flex-wrap:wrap}
.minor button{min-height:40px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;font-size:.86rem}
.minor button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prog-in{max-width:688px;margin:auto;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column}
.brow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.brow:first-child{border-top:0}
.brow .nm{flex:1 1 150px;min-width:0}
.pick{display:flex;gap:3px;align-items:center}
.pick button{background:none;border:0;padding:6px 3px;cursor:pointer;opacity:.45;border-radius:8px}
.pick button[aria-pressed=true]{opacity:1;background:var(--sunk)}
.dist{display:inline-flex;flex-direction:column;gap:3px;min-width:64px}.dbar{display:flex;gap:1px;height:9px;border-radius:4px;overflow:hidden;background:var(--sunk)}.dbar i{display:block}.dbar .v{background:var(--v)}.dbar .a{background:var(--a)}.dbar .r{background:var(--r)}
.brow .dist{width:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-weight:700;font-size:.74rem;color:var(--ink-2);vertical-align:bottom;min-width:62px}
tbody th{font-weight:400;min-width:130px}
.med{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.med input{text-align:right;font-family:var(--f-data)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.note{font-size:.86rem;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);font-size:.92rem}
.brand{display:flex;align-items:center;gap:12px}
.comb{display:grid;grid-template-columns:repeat(2,17px);gap:1px}.comb .hex{width:17px;height:19px}.comb .hex:nth-child(3){grid-column:1/3;justify-self:center;margin-top:-5px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" role="status" hidden></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<input id="photoFile" type="file" accept="image/*" multiple hidden>

<script>
'use strict';
/* ========== INSTRUMENTO: texto de las Fichas de evaluación, Caja 3 AERS ========== */
const ENTORNO=[
 {id:'aire',n:'Calidad del aire exterior',s:[
  ['aire_fuentes','Fuentes cercanas de contaminación (tránsito, humo, polvo, olores)','No se identifican fuentes cercanas de contaminación.','Se identifican algunas fuentes que contaminan el aire, pero sin impacto evidente.','Existen fuentes que contaminan y afectan la calidad del aire, generando molestias o dificultando el aprendizaje.'],
  ['aire_percibida','Calidad del aire percibida en acceso al establecimiento y calles cercanas','El aire se percibe limpio y sin olores molestos.','Ocasionalmente se perciben olores o polvo.','Olores, humo o partículas son frecuentes y generan incomodidad.']]},
 {id:'ruido',n:'Ruido ambiental',s:[
  ['ruido_ext','Percepción de ruidos molestos externos (calles, obras, maquinaria)','El entorno exterior es silencioso o con un ruido ambiente bajo.','Se perciben ruidos esporádicos o moderados.','Ruidos constantes o fuertes que interfieren en las actividades educativas.'],
  ['ruido_barreras','Presencia de barreras naturales o estructurales que atenúen el ruido','Existen barreras que aíslan los ruidos existentes, tales como vegetación o muros.','Existen barreras, pero son insuficientes o muy distantes para mitigar el ruido.','No hay elementos que reduzcan el ruido. El establecimiento está completamente expuesto.']]},
 {id:'confort',n:'Confort climático exterior',s:[
  ['conf_sombra','Cobertura vegetal y presencia de sombra natural','Existe una amplia presencia de arbolado u otras formas de sombra natural.','Presencia parcial de sombra en áreas exteriores del establecimiento.','No existe sombra natural. Exposición directa al sol.'],
  ['conf_verdes','Estado y mantenimiento de áreas verdes','Jardines y áreas verdes cercanas al establecimiento están bien mantenidas.','Mantenimiento irregular de las áreas verdes. Vegetación deteriorada o con zonas secas.','Ausencia o abandono de áreas verdes cercanas al establecimiento.'],
  ['conf_resguardo','Zonas de resguardo ante calor o lluvia','Existen espacios cubiertos o techados accesibles y funcionales.','Existen zonas de resguardo, pero son limitadas o con imperfecciones.','No hay lugares donde protegerse del sol o la lluvia.']]},
 {id:'contam',n:'Presencia de fuentes contaminantes',s:[
  ['cont_transito','Tránsito vehicular intenso (autos, buses, camiones)','Existe un tránsito bajo o alejado del establecimiento.','Tránsito moderado que ocasionalmente afecta el desarrollo académico.','Tránsito constante y muy próximo al establecimiento que genera un impacto evidente.'],
  ['cont_industria','Cercanía de industrias, talleres, zonas de quema o basurales','No existen industrias ni focos de contaminación cercana.','Hay fuentes potenciales, pero no generan impactos significativos.','Presencia cercana de industrias o basurales con emisiones evidentes que afectan al establecimiento.']]}];
const INFRA=[
 {id:'infra',n:'Infraestructura general',s:[
  ['techos','Estado de techos','Techo en buen estado, sin filtraciones, manchas ni signos de deterioro.','Manchas de humedad secas, techumbre envejecida o con reparaciones pendientes.','Filtraciones activas, goteras visibles, partes del techo desprendidas o riesgo de caída.'],
  ['muros','Estado de muros','Muros limpios, sin grietas ni filtraciones, con pintura en buen estado.','Grietas superficiales, pintura descascarada, manchas antiguas sin humedad activa.','Grietas profundas, pintura en mal estado, manchas activas de humedad o moho.'],
  ['pisos','Estado de pisos','Pisos nivelados, limpios, sin daños ni elementos que dificulten el tránsito.','Desgaste visible, pequeñas irregularidades, necesidad de mantención parcial.','Pisos con hoyos, partes levantadas o desniveles peligrosos. Riesgo de accidentes.'],
  ['aislacion','Aislación térmica y sellos de ventanas y puertas','Presencia de aislación adecuada; ventanas y puertas con sellos que impiden corrientes de aire; confort térmico mantenido de forma estable.','Aislación parcial o antigua; sellos deficientes en algunas puertas o ventanas; se perciben zonas frías o filtraciones leves.','No existen aislaciones visibles; entradas de aire por ventanas o puertas mal selladas; sensación térmica muy baja o muy alta; cambios bruscos de temperatura.']]},
 {id:'vent',n:'Ventilación y calidad del aire',s:[
  ['vent_tipo','Tipo de ventilación','Ventilación natural cruzada y/o sistemas mecánicos operativos. Apertura diaria de ventanas en horarios definidos.','Ventanas funcionales pero de difícil apertura. Ventilación intermitente o limitada a ciertos espacios.','No hay ventilación o las ventanas están selladas permanentemente. No existen extractores o estos están fuera de servicio.'],
  ['vent_obstr','Obstrucción de flujos de aire','Flujos de aire despejados. La disposición del mobiliario favorece la circulación.','Algunas obstrucciones limitan el flujo de aire, pero pueden ser corregidas.','Muebles, cortinas o materiales impiden completamente la entrada/salida de aire.']]},
 {id:'term',n:'Condiciones térmicas',s:[
  ['temp','Temperatura interior','Temperatura confortable y estable en la mayoría de los espacios observados.','Temperatura inestable o no óptima, pero tolerable. Se requiere apoyo puntual.','Sensación térmica extremadamente baja o alta. Los estudiantes presentan incomodidad evidente.'],
  ['calef','Uso de calefacción','Uso de calefacción limpia o segura con ventilación planificada.','Uso de calefactores adecuados pero sin rutina de ventilación.','Uso de estufas contaminantes, mal ubicadas o sin ventilación. Riesgo por gases o incendios.']]},
 {id:'hum',n:'Humedad y moho',s:[
  ['humedad','Presencia de humedad','Sin humedad visible ni olores. Ambientes secos y bien mantenidos.','Manchas antiguas o humedad localizada sin signos activos. Sin olor persistente.','Manchas activas, olor a humedad, filtraciones visibles o goteras. Presencia de hongos o moho.'],
  ['condens','Condensación o ventilación deficiente','Ambientes ventilados, sin señales de condensación en ventanas o muros.','Condensación ocasional en días fríos. Ventilación limitada.','Ventanales, muros o techos con condensación frecuente. Ambientes cerrados.']]},
 {id:'prac',n:'Prácticas cotidianas',s:[
  ['rutinas','Rutinas de ventilación','Rutina de ventilación clara, difundida y aplicada diariamente por docentes y estudiantes.','Las ventanas se abren ocasionalmente. No hay protocolos claros.','No existe rutina ni conciencia sobre la ventilación. Las ventanas permanecen cerradas todo el día.'],
  ['limpieza','Limpieza y control de polvo','Superficies limpias, rutinas de limpieza diarias. Buen control del polvo en aulas y zonas comunes.','Limpieza realizada pero sin frecuencia suficiente. Acumulación puntual de polvo.','Ambientes con acumulación de polvo visible. Superficies sucias o mal mantenidas.']]},
 {id:'part',n:'Participación y apropiación comunitaria',s:[
  ['involucra','Involucramiento en el cuidado ambiental','Estudiantes, apoderados y trabajadores participan activamente en acciones de mejora ambiental.','Participación limitada a algunos estamentos o actividades puntuales.','No existen espacios de participación. La comunidad no conoce ni participa en acciones ambientales.'],
  ['edu','Educación ambiental activa','La educación ambiental está integrada al currículo, con actividades visibles y permanentes.','Existen iniciativas aisladas sin articulación curricular.','No se realizan actividades ni se vincula con el currículum.']]}];
const TIPOS={
 entorno:{t:'Entorno inmediato',d:'Calles, plazas y tránsito alrededor de la escuela',dims:ENTORNO,pre:'¿Qué estamos evaluando?',ej:'Ej.: calle de acceso',op:['Calle','Plaza','Tránsito','Otro']},
 exteriores:{t:'Espacio exterior',d:'Patios, canchas, accesos y áreas verdes',dims:INFRA,pre:'Nombre del recinto',ej:'Ej.: patio techado',op:['Patio','Cancha','Acceso','Zona de espera','Área verde','Plaza cercana','Otro']},
 interiores:{t:'Espacio interior',d:'Aulas, biblioteca, comedor, baños y otros',dims:INFRA,pre:'Nombre del recinto',ej:'Ej.: sala 5° básico',op:['Sala de clases','Biblioteca','Comedor','Gimnasio','Oficina','Sala de profesores','Baño','Pasillo','Otro']}};
const ESTAMENTOS=['Estudiante','Docente','Apoderado/a','Asistente de la educación','Directivo/a','Equipo CEDEUS','Otro'];
/* Valores de referencia citados en el Libro AERS. Informan la conversación; no asignan color. */
const MEDS=[
 {id:'mp25',n:'MP2,5',u:'µg/m³',ok:v=>v<=15,ref:'Referencia: hasta 15 (OMS, promedio 24 h). La norma chilena permite hasta 50.'},
 {id:'mp10',n:'MP10',u:'µg/m³',ok:null,ref:'Sin valor de referencia en la Caja.'},
 {id:'co2',n:'CO₂',u:'ppm',ok:v=>v<=1100,ref:'Referencia: hasta 1.100.'},
 {id:'cov',n:'COV',u:'según equipo',ok:null,ref:'Sin valor de referencia: la unidad depende del equipo.'},
 {id:'hr',n:'Humedad relativa',u:'%',ok:v=>v>=40&&v<=60,ref:'Referencia: entre 40 y 60.'},
 {id:'t',n:'Temperatura',u:'°C',ok:v=>v>=18&&v<=24,ref:'Referencia: entre 18 y 24 (OMS).'},
 {id:'db',n:'Ruido de fondo',u:'dB(A)',ok:v=>v<=40,ref:'Referencia: hasta 35-40 en aulas.'}];
const CL={v:'Verde',a:'Amarillo',r:'Rojo'},CN={v:'Adecuado',a:'Intermedio',r:'Crítico'},L={v:'V',a:'A',r:'R'};
const isCol=c=>c==='v'||c==='a'||c==='r';
const allDims=[...ENTORNO,...INFRA];

/* ========== LECTURA DE PERCEPCIONES: se cuenta y se muestra; no se calcula un veredicto ========== */
function parseNum(s){ if(s==null) return null; const t=String(s).trim().replace(/\s/g,'').replace(',','.'); if(t==='') return null; const v=Number(t); return Number.isFinite(v)?v:null }
function estadoRef(id,val){ const m=MEDS.find(x=>x.id===id),v=parseNum(val); return m&&m.ok&&v!==null?(m.ok(v)?'dentro':'fuera'):null }
function resumenDims(fichas){
  return allDims.map(d=>{
    const c={v:0,a:0,r:0};
    for(const f of fichas){ if(!TIPOS[f.tipo]||!TIPOS[f.tipo].dims.includes(d)) continue;
      for(const s of d.s){ const x=(f.resp||{})[s[0]]; if(x&&isCol(x.c)) c[x.c]++ } }
    return {d,c,n:c.v+c.a+c.r,dividida:c.v>0&&c.r>0};
  });
}
function resumenMeds(ms){
  return MEDS.map(m=>{ const rows=ms.map(x=>({e:x.espacio,v:parseNum((x.val||{})[m.id])})).filter(x=>x.v!==null);
    return {m,rows,fuera:m.ok?rows.filter(x=>!m.ok(x.v)).length:0,min:rows.length?Math.min(...rows.map(x=>x.v)):null,max:rows.length?Math.max(...rows.map(x=>x.v)):null};
  });
}
/* ========== ALMACENAMIENTO LOCAL ========== */
const STORES=['visitas','fichas','meds','fotos'];
const S={visitas:[],fichas:[],meds:[],fotos:[]};
let idb=null, storageOK=true;
function openDB(){return new Promise(res=>{ try{ const r=indexedDB.open('aers-terreno',1);
  r.onupgradeneeded=()=>{for(const s of STORES) r.result.createObjectStore(s,{keyPath:'id'})};
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null);
 }catch(e){res(null)} })}
function dbAll(st){return new Promise(res=>{ if(!idb) return res([]); try{const q=idb.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])} })}
function dbPut(st,o){ if(!idb) return; try{const t=idb.transaction(st,'readwrite');t.objectStore(st).put(o);t.onerror=storeFail;t.onabort=storeFail;if(t.commit)t.commit()}catch(e){storeFail()} }
function dbDel(st,id){ if(!idb) return; try{const t=idb.transaction(st,'readwrite');t.objectStore(st).delete(id);if(t.commit)t.commit()}catch(e){} }
function storeFail(){ if(storageOK){storageOK=false;toast('No se pudo guardar en este dispositivo. Exporta el paquete antes de cerrar.')} }
function upsert(st,o){ o.updatedAt=Date.now(); const a=S[st],i=a.findIndex(x=>x.id===o.id); if(i<0)a.push(o);else a[i]=o; dbPut(st,o) }
function remove(st,id){ S[st]=S[st].filter(x=>x.id!==id); dbDel(st,id) }

const urlCache=new Map();

  ${fs.length?`<section class="panel"><div><h2>Miradas por estamento</h2><p class="muted small">Sirve para abrir la conversación donde las percepciones no coinciden.</p></div>${tabla('Estamento',ests.map(e=>[e,fs.filter(f=>(f.estamento||'Sin indicar')===e)]))}</section>
  <section class="panel"><h2>Comparar espacios</h2>${tabla('Espacio',fs.map(f=>[f.recinto||'Sin nombre',[f]]))}</section>`:''}
  <section class="panel"><h2>Percibido como crítico (${crit.length})</h2>${crit.length?crit.map(({f,s,r})=>`<div><b>${esc(s[1])}</b><br><span class="small muted">${esc(f.recinto||'Sin nombre')}${f.estamento?' · '+esc(f.estamento):''}${r.o?' · '+esc(r.o):''}</span></div>`).join(''):'<p class="muted">Nadie marcó una subdimensión en rojo.</p>'}</section>
  <section class="panel"><h2>Llevar los datos</h2><div class="stack">
   <button class="btn primary" data-act="pkg" data-v="${esc(v.id)}">Exportar paquete completo</button><p class="small muted">Incluye fotos. Sirve para consolidar en otro equipo o guardar un respaldo.</p>
   ${navigator.canShare?`<button class="btn" data-act="pkgShare" data-v="${esc(v.id)}">Enviar paquete por otra app</button>`:''}
   <div class="grid2"><button class="btn" data-act="csvF" data-v="${esc(v.id)}">Fichas en CSV</button><button class="btn" data-act="csvM" data-v="${esc(v.id)}">Mediciones en CSV</button></div>
   <button class="btn" data-act="copy" data-v="${esc(v.id)}">Copiar resumen</button></div></section>`;
}

/* ========== EXPORTACIÓN ========== */
const cell=x=>{let s=String(x==null?'':x);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>'﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n');
const slug=s=>(s||'visita').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'visita';
function csvFichas(v){
  const rows=[['visita_id','escuela','comuna','rbd','fecha','visita_lat','visita_lon','ficha_id','tipo_ficha','recinto','tipo_recinto','evaluador','estamento','hora','dimension','subdimension_id','subdimension','color','observaciones','n_fotos_ficha']];
  S.fichas.filter(f=>f.visitaId===v.id).forEach(f=>TIPOS[f.tipo].dims.forEach(d=>d.s.forEach(s=>{const r=(f.resp||{})[s[0]]||{};
    rows.push([v.id,v.escuela,v.comuna,v.rbd,v.fecha,v.gps?v.gps.lat:'',v.gps?v.gps.lon:'',f.id,f.tipo,f.recinto,f.tipoRecinto,f.evaluador,f.estamento,f.hora,d.n,s[0],s[1],r.c==='na'?'no aplica':isCol(r.c)?CL[r.c].toLowerCase():'',r.o,S.fotos.filter(p=>p.fichaId===f.id).length])})));
  return toCSV(rows);
}
function csvMeds(v){
  const rows=[['visita_id','escuela','comuna','fecha','espacio','hora','puertas_ventanas','instrumento','variable','unidad','valor','referencia','observaciones']];
  S.meds.filter(m=>m.visitaId===v.id).forEach(m=>MEDS.forEach(x=>{const n=parseNum((m.val||{})[x.id]);if(n===null)return;
    rows.push([v.id,v.escuela,v.comuna,v.fecha,m.espacio,m.hora,m.vent,m.instrumento,x.n,x.u,n,estadoRef(x.id,n)||'',m.obs])}));
  return toCSV(rows);
}
const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function paquete(v){
  const fichas=S.fichas.filter(f=>f.visitaId===v.id),meds=S.meds.filter(m=>m.visitaId===v.id),fp=S.fotos.filter(p=>p.visitaId===v.id);
  const fotos=[];for(const p of fp){const {blob,...rest}=p;fotos.push({...rest,data:await toDataURL(blob)})}
  return JSON.stringify({app:'aers-terreno',version:1,exportado:new Date().toISOString(),visita:v,fichas,meds,fotos});
}
function bajar(name,content,type){
  const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast(isSite?`Descargado: ${name}`:'Las descargas funcionan en tu sitio publicado, no en esta vista previa.');
}
function textoResumen(v){
  const fs=S.fichas.filter(f=>f.visitaId===v.id),ms=S.meds.filter(m=>m.visitaId===v.id),ac=v.acuerdos||{};
  const out=[`AERS · ${v.escuela}${v.comuna?', '+v.comuna:''} · ${fFecha(v.fecha)}`,`${fs.length} fichas, ${ms.length} registros de medición`,''];
  resumenDims(fs).filter(x=>x.n).forEach(x=>{const c=ac[x.d.id];out.push(`${x.d.n}: ${x.c.v}V ${x.c.a}A ${x.c.r}R · ${c?'acordado '+CL[c].toLowerCase():'por acordar'}`)});
  const rm=resumenMeds(ms).filter(x=>x.rows.length);if(rm.length){out.push('','Mediciones:');rm.forEach(x=>{const c=ac[x.m.id];out.push(`${x.m.n}: ${x.min===x.max?x.min:x.min+' a '+x.max} ${x.m.u}${x.fuera?` · ${x.fuera} fuera de referencia`:''}${c?' · acordado '+CL[c].toLowerCase():''}`)})}
  return out.join('\n');
}
/* ========== IMPORTACIÓN Y CONSOLIDACIÓN ========== */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
function limpiarResp(r){const o={};if(r&&typeof r==='object')for(const[k,x]of Object.entries(r)){if(x&&typeof x==='object')o[k]={c:isCol(x.c)||x.c==='na'?x.c:undefined,o:typeof x.o==='string'?x.o:''}}return o}
async function importar(texto){
  let P;try{P=JSON.parse(texto)}catch(e){throw new Error('El archivo no es un paquete válido.')}
  if(!P||P.app!=='aers-terreno'||!P.visita||!P.visita.id||!Array.isArray(P.fichas)) throw new Error('Este archivo no es un paquete de AERS en terreno.');
  let dest=S.visitas.find(v=>v.id===P.visita.id)||S.visitas.find(v=>norm(v.escuela)===norm(P.visita.escuela)&&v.fecha===P.visita.fecha&&!v.ejemplo);
  let unida=!!dest;
  if(!dest){dest={...P.visita,acuerdos:P.visita.acuerdos||{}};upsert('visitas',dest)}
  else{dest.acuerdos={...(P.visita.acuerdos||{}),...(dest.acuerdos||{})};if(!dest.gps&&P.visita.gps)dest.gps=P.visita.gps;upsert('visitas',dest)}
  let nf=0,nm=0,np=0;
  const nuevo=(st,o)=>{const e=S[st].find(x=>x.id===o.id);return !e||(o.updatedAt||0)>(e.updatedAt||0)};
  for(const f of P.fichas){if(!f||!f.id||!TIPOS[f.tipo]||!nuevo('fichas',f))continue;const u=f.updatedAt;upsert('fichas',{...f,resp:limpiarResp(f.resp),visitaId:dest.id});const g=S.fichas.find(x=>x.id===f.id);g.updatedAt=u||g.updatedAt;dbPut('fichas',g);nf++}
  for(const m of P.meds||[]){if(!m||!m.id||!nuevo('meds',m))continue;upsert('meds',{...m,visitaId:dest.id});nm++}
  for(const p of P.fotos||[]){if(!p||!p.id||S.fotos.some(x=>x.id===p.id)||typeof p.data!=='string'||!/^data:image\/(jpeg|png|webp);base64,/.test(p.data))continue;
    const blob=await (await fetch(p.data)).blob().catch(()=>null);if(!blob)continue;const {data,...rest}=p;upsert('fotos',{...rest,visitaId:dest.id,blob});np++}
  return {dest,unida,nf,nm,np};
}
/* ========== FOTOS ========== */
async function comprimir(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',.72));
  }finally{URL.revokeObjectURL(url)}
}
/* ========== EVENTOS ========== */
function crearFicha(vid,tipo){const f={id:uid(),visitaId:vid,tipo,recinto:'',tipoRecinto:'',evaluador:lsGet('aers-eval')||'',estamento:lsGet('aers-est')||'',hora:ahora(),resp:{},createdAt:Date.now()};upsert('fichas',f);go('f-'+f.id)}
const acciones={
 nueva(){go('nueva')},
 importar(){$('#importFile').click()},
 tab(d){UI.tab[d.v]=d.k;render()},
 addF(d){crearFicha(d.v,d.t)},
 addM(d){const m={id:uid(),visitaId:d.v,espacio:'',hora:ahora(),vent:'',instrumento:lsGet('aers-ins')||'',val:{},obs:'',createdAt:Date.now()};upsert('meds',m);go('m-'+m.id)},
 col(d,el){const f=cur('fichas');if(!f)return;f.resp=f.resp||{};const r=f.resp[d.s]||(f.resp[d.s]={});r.c=r.c===d.c?undefined:d.c;upsert('fichas',f);
   const art=el.closest('.sub');art.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===r.c)));art.classList.toggle('done',!!r.c);
   const tot=subsDe(f).length,ok=answered(f);$('#progN').textContent=`${ok}/${tot}`;$('#progB').style.width=(ok/tot*100)+'%'},
 acuerdo(d){const v=S.visitas.find(x=>x.id===d.v);v.acuerdos=v.acuerdos||{};if(v.acuerdos[d.d]===d.c)delete v.acuerdos[d.d];else v.acuerdos[d.d]=d.c;upsert('visitas',v);render()},
 gps(d){const v=S.visitas.find(x=>x.id===d.v);if(!navigator.geolocation)return toast('Este dispositivo no ofrece GPS.');toast('Buscando ubicación…');
   navigator.geolocation.getCurrentPosition(p=>{v.gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};upsert('visitas',v);toast('Ubicación registrada.');render()},
   e=>toast(e.code===1?'El permiso de ubicación está bloqueado. Actívalo en el navegador.':'No se obtuvo señal. Inténtalo al aire libre.'),{enableHighAccuracy:true,timeout:20000,maximumAge:60000})},
 foto(d){UI.photoFor=d.id;$('#photoFile').click()},
 delFoto(d){const p=S.fotos.find(x=>x.id===d.id);remove('fotos',d.id);if(p)drawThumbs(p.fichaId)},
 delF(d,el){arm('delF'+d.id,()=>{const f=S.fichas.find(x=>x.id===d.id);S.fotos.filter(p=>p.fichaId===d.id).forEach(p=>remove('fotos',p.id));remove('fichas',d.id);go('v-'+f.visitaId)})},
 delM(d){arm('delM'+d.id,()=>{const m=S.meds.find(x=>x.id===d.id);remove('meds',d.id);go('v-'+m.visitaId)})},
 delV(d){arm('delV'+d.id,()=>{S.fichas.filter(f=>f.visitaId===d.id).forEach(f=>remove('fichas',f.id));S.meds.filter(f=>f.visitaId===d.id).forEach(f=>remove('meds',f.id));S.fotos.filter(f=>f.visitaId===d.id).forEach(f=>remove('fotos',f.id));remove('visitas',d.id);go('inicio')})},
 async pkg(d){const v=S.visitas.find(x=>x.id===d.v);bajar(`aers_${slug(v.escuela)}_${v.fecha}.json`,await paquete(v),'application/json')},
 async pkgShare(d){const v=S.visitas.find(x=>x.id===d.v);const file=new File([await paquete(v)],`aers_${slug(v.escuela)}_${v.fecha}.json`,{type:'application/json'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Paquete AERS'})}catch(e){}}else toast('Este dispositivo no permite enviar archivos. Usa Exportar paquete completo.')},
 csvF(d){const v=S.visitas.find(x=>x.id===d.v);bajar(`aers_fichas_${slug(v.escuela)}_${v.fecha}.csv`,csvFichas(v),'text/csv;charset=utf-8')},
 csvM(d){const v=S.visitas.find(x=>x.id===d.v);bajar(`aers_mediciones_${slug(v.escuela)}_${v.fecha}.csv`,csvMeds(v),'text/csv;charset=utf-8')},
 async copy(d){const v=S.visitas.find(x=>x.id===d.v);try{await navigator.clipboard.writeText(textoResumen(v));toast('Resumen copiado.')}catch(e){toast('No se pudo copiar en este navegador.')}}
};
function arm(k,fn){if(UI.armed===k){UI.armed=null;if(k.startsWith('delV')&&S.visitas.find(v=>'delV'+v.id===k&&v.ejemplo))lsSet('aers-ejemplo-visto','1');fn()}else{UI.armed=k;render();setTimeout(()=>{if(UI.armed===k){UI.armed=null;render()}},5000)}}
function cur(st){const h=location.hash.slice(1),id=h.slice(2);return S[st].find(x=>x.id===id)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=acciones[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset;
  if(ds.ff){const f=cur('fichas');if(!f)return;f[ds.ff]=t.value;upsert('fichas',f);if(ds.ff==='evaluador')lsSet('aers-eval',t.value);if(ds.ff==='estamento')lsSet('aers-est',t.value);
    if(ds.ff==='recinto')$('.top h1').firstChild.textContent=t.value||TIPOS[f.tipo].t}
  else if(ds.obs){const f=cur('fichas');if(!f)return;f.resp=f.resp||{};(f.resp[ds.obs]||(f.resp[ds.obs]={})).o=t.value;upsert('fichas',f)}
  else if(ds.mf){const m=cur('meds');if(!m)return;m[ds.mf]=t.value;upsert('meds',m);if(ds.mf==='instrumento')lsSet('aers-ins',t.value)}
  else if(ds.mv){const m=cur('meds');if(!m)return;m.val=m.val||{};m.val[ds.mv]=t.value;upsert('meds',m);$('#chip-'+ds.mv).innerHTML=refTag(estadoRef(ds.mv,t.value))}
});
document.addEventListener('submit',e=>{if(e.target.id!=='fNueva')return;e.preventDefault();
  const v={id:uid(),escuela:$('#nEsc').value.trim(),comuna:$('#nCom').value.trim(),rbd:$('#nRbd').value.trim(),fecha:$('#nFec').value,responsable:$('#nRes').value.trim(),gps:null,acuerdos:{},createdAt:Date.now()};
  if(!v.escuela)return;lsSet('aers-resp',v.responsable);upsert('visitas',v);go('v-'+v.id)});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const r=await importar(await f.text());toast(`${r.unida?'Sumado a':'Nueva visita:'} ${r.dest.escuela}: ${r.nf} fichas, ${r.nm} mediciones, ${r.np} fotos.`);go('v-'+r.dest.id)}catch(err){toast(err.message)}});
$('#photoFile').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';const fid=UI.photoFor,f=S.fichas.find(x=>x.id===fid);if(!f)return;
  for(const file of files){if(S.fotos.filter(p=>p.fichaId===fid).length>=6){toast('Máximo 6 fotos por ficha.');break}
    try{const blob=await comprimir(file);if(!blob)throw 0;upsert('fotos',{id:uid(),fichaId:fid,visitaId:f.visitaId,blob,createdAt:Date.now()})}catch(err){toast('No se pudo leer esa imagen.')}}
  drawThumbs(fid)});
addEventListener('hashchange',()=>{UI.armed=null;render();scrollTo(0,0)});
addEventListener('online',()=>{if(routeIs('inicio'))render()});addEventListener('offline',()=>{if(routeIs('inicio'))render()});
const routeIs=r=>(location.hash.slice(1)||'inicio')===r;
function render(){
  const h=location.hash.slice(1)||'inicio',app=$('#app');let html;
  const id=h.slice(2);
  if(h==='nueva')html=vNueva();
  else if(h.startsWith('v-')&&S.visitas.some(v=>v.id===id))html=vVisita(S.visitas.find(v=>v.id===id));
  else if(h.startsWith('f-')&&S.fichas.some(f=>f.id===id))html=vFicha(S.fichas.find(f=>f.id===id));
  else if(h.startsWith('m-')&&S.meds.some(m=>m.id===id))html=vMed(S.meds.find(m=>m.id===id));
  else html=vInicio();
  app.innerHTML=html;
  if(h.startsWith('f-'))drawThumbs(id);
}
/* ========== EJEMPLO INICIAL (datos inventados) ========== */
function sembrarEjemplo(){
  const vid=uid();let t=Date.now();
  upsert('visitas',{id:vid,escuela:'Escuela de ejemplo',comuna:'Comuna de ejemplo',rbd:'',fecha:hoy(),responsable:'Equipo de ejemplo',gps:null,acuerdos:{},ejemplo:true,createdAt:t});
  const F=(tipo,recinto,tipoRecinto,est,resp)=>upsert('fichas',{id:uid(),visitaId:vid,tipo,recinto,tipoRecinto,evaluador:'Equipo de ejemplo',estamento:est,hora:'10:30',resp,createdAt:t++});

  F('interiores','Sala 5° básico','Sala de clases','Docente',R({techos:'a',muros:['r','Mancha activa de humedad en el muro sur (dato de ejemplo).'],pisos:'v',aislacion:'r',vent_tipo:'a',vent_obstr:'v',temp:'a',calef:'a',humedad:'r',condens:'r',rutinas:'a',limpieza:'v',involucra:'a',edu:'a'}));
  F('exteriores','Patio central','Patio','Estudiante',R({techos:'na',muros:'a',pisos:'a',aislacion:'na',vent_tipo:'na',vent_obstr:'v',temp:'r',calef:'na',humedad:'v',condens:'na',rutinas:'na',limpieza:'v',involucra:'a',edu:'a'}));
  F('entorno','Calle de acceso','Calle','Apoderado/a',R({aire_fuentes:'a',aire_percibida:'a',ruido_ext:['r','Paso frecuente de buses en horario de clases (dato de ejemplo).'],ruido_barreras:'a',conf_sombra:'r',conf_verdes:'a',conf_resguardo:'a',cont_transito:'a',cont_industria:'v'}));
  upsert('meds',{id:uid(),visitaId:vid,espacio:'Sala 5° básico',hora:'11:10',vent:'Cerradas',instrumento:'Dispositivo de ejemplo',val:{mp25:'22',co2:'1640',hr:'68',t:'16,5',db:'43'},obs:'',createdAt:t++});
  upsert('meds',{id:uid(),visitaId:vid,espacio:'Patio central',hora:'11:40',vent:'',instrumento:'Dispositivo de ejemplo',val:{mp25:'12',t:'19'},obs:'',createdAt:t++});

/* ========== USO SIN INTERNET ========== */
async function prepararOffline(){
  if(!isSite||!('serviceWorker' in navigator)){UI.offline='no';return}
  try{ UI.offline=navigator.serviceWorker.controller?'lista':'preparando';
    await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const ok=await caches.has('aers-v1')&&await caches.open('aers-v1').then(c=>c.match('./'));
    UI.offline=ok?'lista':'preparando';
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){UI.offline='no'}
  if(routeIs('inicio'))render();
}
(async function(){
  idb=await openDB();
  for(const s of STORES)S[s]=await dbAll(s);

  render();
  prepararOffline().then(()=>{if(routeIs('inicio'))render()});
})();
